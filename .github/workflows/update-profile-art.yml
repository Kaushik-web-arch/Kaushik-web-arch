name: Refresh profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install profile dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate profile
        run: |
          python scripts/make_ascii_svg.py
          python scripts/make_info_card.py
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
          python scripts/update_project_index.py

      - name: Commit refreshed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/kaushik-ascii.svg assets/info-card.svg assets/contrib-heatmap.svg data/contributions.json
          if git diff --cached --quiet; then
            echo "Profile is already current."
          else
            git commit -m "chore: refresh profile [skip ci]"
            git push
          fi
